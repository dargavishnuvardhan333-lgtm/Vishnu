<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - manu influncer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }
    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: #0f172a;
      color: white;
      padding: 18px 0;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logout {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 6px;
      padding: 8px 12px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    .content {
      padding: 30px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15,23,42,0.08);
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #e0f2fe;
      color: #0f172a;
    }
    .empty {
      padding: 20px;
      background: white;
      border-radius: 12px;
      text-align: center;
      color: #64748b;
      box-shadow: 0 10px 24px rgba(15,23,42,0.05);
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-row">
      <h1>Admin Dashboard</h1>
      <a class="logout" href="/admin/logout">Log out</a>
    </div>
  </header>

  <div class="container content">
    <h2>Submitted Messages</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Mobile number</th>
          <th>Message</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="5" class="empty">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadMessages() {
      try {
        const response = await fetch('/api/messages');
        const data = await response.json();
        const tbody = document.getElementById('table-body');

        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No messages found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.phone || 'Not provided'}</td>
            <td>${item.message}</td>
            <td>${item.created_at}</td>
          </tr>
        `).join('');
      } catch (error) {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="5" class="empty">Failed to load data.</td></tr>';
      }
    }

    loadMessages();
  </script>
</body>
</html>
