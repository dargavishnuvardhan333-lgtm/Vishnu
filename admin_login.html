<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }
    .login-box {
      width: min(90%, 360px);
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
    }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: 8px; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font: inherit;
    }
    input { margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { border: 0; border-radius: 6px; background: #0f172a; color: white; cursor: pointer; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Admin Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus />
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
